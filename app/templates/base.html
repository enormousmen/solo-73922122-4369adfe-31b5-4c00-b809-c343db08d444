<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OCI 镜像清理预演{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #0f3057; color: #fff; padding: 14px 24px; }
    header h1 { margin: 0; font-size: 18px; }
    header .sub { font-size: 12px; opacity: .75; margin-top: 2px; }
    main { max-width: 1080px; margin: 20px auto; padding: 0 16px 48px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
            padding: 16px 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    .card h3 { margin: 14px 0 6px; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #edf2f7; }
    th { background: #f8fafc; font-weight: 600; }
    code { background: #eef2f7; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
    .ok   { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46;
            border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
    .warn { background: #fffbeb; border: 1px solid #fcd34d; color: #92400e;
            border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
    .err  { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b;
            border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
    .info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
            border-radius: 6px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
    button, .btn { background: #0f3057; color: #fff; border: 0; border-radius: 6px;
                   padding: 8px 16px; font-size: 14px; cursor: pointer; text-decoration: none;
                   display: inline-block; }
    button:hover, .btn:hover { background: #16407a; }
    .btn.secondary { background: #64748b; }
    label.tag { display: inline-block; margin: 3px 14px 3px 0; font-size: 13px; }
    .muted { color: #64748b; font-size: 12px; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    textarea { width: 100%; min-height: 90px; font-family: ui-monospace, monospace;
               font-size: 12px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; }
    .grid { display: flex; gap: 24px; flex-wrap: wrap; }
    .grid > div { min-width: 240px; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
<header>
  <h1>OCI 镜像清理预演</h1>
  <div class="sub">退役旧标签 · 预估可释放空间 · 复核后发放清理清单</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
